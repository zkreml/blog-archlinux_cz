# arch-linux.cz on blog.sh -- site configuration
# Palette and layout mirror the current Hugo/Blowfish site (Tailwind
# slate/blue, dark-first). The visual skin lives in assets/css/skin.css.

site:
  title: "Arch Linux CZ"
  short_name: "Arch Linux CZ"
  description: "Česká komunita Arch Linuxu"
  author: "Arch Linux CZ"
  lang: "cs"
  locale: "cs_CZ"
  page_size: 5
  timezone: "Europe/Prague"
  base_url: "https://arch-linux.cz"
  extra_css:
    - "/assets/css/skin.css"

banner:
  # The community logo -- skin.css lays it out as a compact top-bar
  # wordmark next to the site name instead of a full-width banner.
  src: "/assets/images/header.png"
  alt: "Arch Linux CZ"
  width: 65
  height: 65
  show_title: true
  show_claim: false

# Tailwind slate + blue, measured on the live arch-linux.cz (Blowfish).
colors:
  light:
    bg: "#ffffff"
    text: "#334155"
    meta_text: "#64748b"
    accent: "#1d4ed8"
    nav_bg: "#ffffff"
    border: "#cbd5e1"
    pill_bg: "#dbeafe"
  dark:
    bg: "#1e293b"
    text: "#cbd5e1"
    meta_text: "#94a3b8"
    accent: "#60a5fa"
    nav_bg: "#1e293b"
    border: "#475569"
    pill_bg: "#1e3a5f"

fonts:
  banner_title: "ui-sans-serif, system-ui, sans-serif"
  banner_title_size: "18px"

layout:
  # The sidebar exists only to carry the About text below -- skin.css
  # shows it solely on the homepage as the centered intro block under
  # the title (the Blowfish profile) and hides it everywhere else.
  sidebar: true
  # Lifts a post's first image above the title (like Blowfish's hero
  # style) -- and out of the text column, so the contents list starts
  # level with the first paragraph instead of beside the image.
  hero: true

nav:
  - { label: "Domů", url: "/" }
  - { label: "Návody", tag: "navody" }
  - { label: "Zprávy", tag: "zpravy" }
  - { label: "O Arch Linuxu", url: "/o-arch-linuxu/" }
  - { label: "Wiki", url: "https://wiki.arch-linux.cz/shelves/arch-linux-cz" }
  - { label: "Fórum", url: "https://forum.arch-linux.cz/" }
  - { label: "Komunita", url: "/komunita/" }
  - { label: "Podpořte nás", url: "/podporte-nas/" }

about:
  # Empty on purpose: the intro flows straight under the site title on
  # the homepage, a heading over it would double the h1 above.
  heading: ""
  html: |-
    Jsme česká komunita nadšenců kolem Arch Linuxu. Najdeš tu návody, novinky a diskuze v češtině — od základní instalace až po pokročilou správu systému.

    Věříme v open source, soukromí a svobodný software. Provozujeme vlastní komunitní infrastrukturu — wiki, fórum, PeerTube a další služby postavené na otevřených technologiích.

    ## Hosting

    Tento web i komunitní služby jsou hostovány na [OSCloud](https://oscloud.cz/) — české cloudové platformě zaměřené na soukromí a open source. OSCloud provozuje vlastní infrastrukturu postavenou výhradně na svobodném softwaru a nabízí alternativu ke komerčním cloudovým gigantům.

footer:
  links_heading: ""
  links: []
  note_heading: ""
  note_html: ""
  copyright: "&copy; 2026 Arch Linux CZ &middot; Postaveno na [./blog.sh](https://blogsh.app)"
  social_heading: ""

social:
  - name: "Mastodon"
    url: "https://gts.arch-linux.cz/@arch"
    icon: "mastodon"
    rel: "me"
  - name: "Git"
    url: "https://git.arch-linux.cz/ArchlinuxCz"
    icon: "github"
  - name: "RSS"
    url: "/rss.xml"
    icon: "rss"

analytics:
  src: "https://analytics.oscloud.cz/script.js"
  website_id: "099026d3-0ad2-437f-a7e5-20507e3267e2"

mastodon:
  instance: "gts.arch-linux.cz"
  toot_length: 5000

comments:
  approval: fav

widgets:
  rss:
    heading: "Z Fediverse"
    feed_url: "https://gts.arch-linux.cz/@arch/feed.rss"
    limit: 5
  commits:
    heading: "Poslední commity"
    username: "Archos"
    limit: 5
    instance: "https://git.arch-linux.cz"
