name: blog-cron
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install ruby
        run: sudo apt-get update && sudo apt-get install -y ruby-full
      - name: install cloudron cli
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          npm install -g cloudron
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - name: create env.sh
        run: |
          cp env.sh.example env.sh
          chmod 600 env.sh
          echo "export SITE_BASE_URL=https://arch-linux.cz" >> env.sh
          echo "export MASTODON_ACCESS_TOKEN=${{ secrets.MASTODON_ACCESS_TOKEN }}" >> env.sh
      - name: build site
        run: ruby build/build_blog.rb
      - name: refresh sidebar
        run: ./scripts/refresh-sidebar.sh
      - name: publish scheduled
        run: ./scripts/publish-scheduled.sh
      - name: deploy to LAMP
        run: cloudron --server my.oscloud.cz --token ${{ secrets.CLOUDRON_TOKEN }} sync push --app arch-linux.cz public.nosync/ /app/data/public
